name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # TEMPORARY DIAGNOSTIC (remove once green): surface Maven errors as
      # annotations, since job logs are not retrievable from the sandbox.
      - name: Build, test, and verify (Spotless + license + JaCoCo)
        id: build
        run: |
          set +e
          ./mvnw -B -ntp verify > maven.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 40 maven.log

      - name: Report Maven errors as annotations
        if: steps.build.outputs.exit_code != '0'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('maven.log').read_text().splitlines()[-65:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Maven verification::' + text)
          PY

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/**'
          if-no-files-found: ignore
