name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # One reactor invocation covers transform JUnit tests, engine tests and packaged CLI
      # Failsafe E2E without spending the five-minute reservation rebuilding modules repeatedly.
      - name: Verify reactor including JUnit and packaged CLI E2E
        run: ./mvnw -B -ntp verify 2>&1 | tee -a "$RUNNER_TEMP/seatunnel-maven.log"

      - name: Summarize verification failures without a rerun
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'seatunnel-maven.log'
          lines = path.read_text(errors='replace').splitlines() if path.exists() else []
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-60:])[:20000]
          for index, offset in enumerate(range(0, len(text), 2500)):
              part = text[offset:offset+2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Verification {index}::' + part)
          PYCODE

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
          if-no-files-found: ignore
