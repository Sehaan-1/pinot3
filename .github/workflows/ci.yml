name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test engine planning contracts
        run: ./mvnw -pl seatunnel-engine -am test

      - name: Test connectors and local core
        run: ./mvnw -pl connector-fake,connector-console,seatunnel-core -am test

      - name: Verify runnable CLI and E2E
        run: ./mvnw -pl seatunnel-cli -am verify

      - name: Run documented local example
        run: java -jar seatunnel-cli/target/seatunnel-cli-3.0.0-SNAPSHOT.jar --config examples/fake-to-console.conf --mode local

      - name: Build, test, and verify (Spotless + license + JaCoCo)
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
          if-no-files-found: ignore
