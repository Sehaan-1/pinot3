name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test field transforms and local chain contracts
        run: ./mvnw -pl seatunnel-transforms-v2,seatunnel-core -am test 2>&1 | tee -a "$RUNNER_TEMP/seatunnel-maven.log"

      - name: Verify engine cluster and task execution
        run: ./mvnw -pl seatunnel-engine -am verify 2>&1 | tee -a "$RUNNER_TEMP/seatunnel-maven.log"

      - name: Test connectors and local core
        run: ./mvnw -pl connector-fake,connector-console,seatunnel-core -am test 2>&1 | tee -a "$RUNNER_TEMP/seatunnel-maven.log"

      - name: Verify runnable CLI and E2E
        run: ./mvnw -pl seatunnel-cli -am verify 2>&1 | tee -a "$RUNNER_TEMP/seatunnel-maven.log"

      - name: Run documented local example
        run: java -jar seatunnel-cli/target/seatunnel-cli-3.0.0-SNAPSHOT.jar --config examples/fake-to-console.conf --mode local

      - name: Run documented transform example
        run: java -jar seatunnel-cli/target/seatunnel-cli-3.0.0-SNAPSHOT.jar --config examples/fake-rename-copy-console.conf --mode local

      - name: Build, test, and verify (Spotless + license + JaCoCo)
        run: ./mvnw -B -ntp verify 2>&1 | tee -a "$RUNNER_TEMP/seatunnel-maven.log"

      - name: Summarize verification failures without a rerun
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'seatunnel-maven.log'
          lines = path.read_text(errors='replace').splitlines() if path.exists() else []
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-60:])[:20000]
          for index, offset in enumerate(range(0, len(text), 2500)):
              part = text[offset:offset+2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Verification {index}::' + part)
          PYCODE

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
          if-no-files-found: ignore
