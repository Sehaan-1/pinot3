name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test common and config contracts
        run: ./mvnw -pl seatunnel-common,seatunnel-config -am test

      - name: Test API contracts
        run: ./mvnw -pl seatunnel-api -am test

      - name: Temporary formatter diagnostic
        run: |
          ./mvnw -B -ntp spotless:apply
          python3 - <<'PYCODE'
          import base64, subprocess
          diff = subprocess.check_output(['git', 'diff', '--', 'seatunnel-api'])
          print('::warning title=Formatting patch::' + base64.b64encode(diff).decode())
          PYCODE

      - name: Build, test, and verify (Spotless + license + JaCoCo)
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/**'
          if-no-files-found: ignore
