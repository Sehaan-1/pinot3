name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test common and config contracts
        run: ./mvnw -pl seatunnel-common,seatunnel-config -am test

      - name: Test API contracts
        run: ./mvnw -pl seatunnel-api -am test

      - name: Test plugin discovery and formats
        run: |
          set +e
          ./mvnw -B -ntp -pl seatunnel-plugin-discovery,seatunnel-formats -am test > slice4.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          text = '\n'.join(Path('slice4.log').read_text().splitlines()[-85:])
          if '[ERROR]' in text:
              for index in range(0, len(text), 2500):
                  part = text[index:index + 2500]
                  print(f'::error title=Slice 4 {index}::' + part.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
          exit "$status"

      - name: Temporary formatting and build diagnostics
        run: |
          set +e
          ./mvnw -B -ntp spotless:apply > formatter.log 2>&1
          python3 - <<'PYCODE'
          import base64, subprocess
          diff = subprocess.check_output(['git', 'diff', '--', 'seatunnel-plugin-discovery', 'seatunnel-formats'])
          encoded = base64.b64encode(diff).decode()
          for index, offset in enumerate(range(0, len(encoded), 3500)):
              print(f'::warning title=Formatting patch {index}::' + encoded[offset:offset + 3500])
          PYCODE

      - name: Build, test, and verify (Spotless + license + JaCoCo)
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/**'
          if-no-files-found: ignore
