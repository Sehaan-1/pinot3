name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Temporary format bootstrap (budgeted run 1 of 2)
        run: ./mvnw -B -ntp spotless:apply

      - name: Temporary formatting patch JobDefinition
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/main/java/org/apache/seatunnel/engine/submission/JobDefinition.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=JobDefinition patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch SubmissionPlan
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/main/java/org/apache/seatunnel/engine/submission/SubmissionPlan.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=SubmissionPlan patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch SubmissionException
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/main/java/org/apache/seatunnel/engine/submission/SubmissionException.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=SubmissionException patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch JobSubmissionService
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/main/java/org/apache/seatunnel/engine/submission/JobSubmissionService.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=JobSubmissionService patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch JobRestServer
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/main/java/org/apache/seatunnel/engine/rest/JobRestServer.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=JobRestServer patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch SubmissionValidationTest
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/test/java/org/apache/seatunnel/engine/submission/SubmissionValidationTest.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=SubmissionValidationTest patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch JobRestServerIT
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-engine/src/test/java/org/apache/seatunnel/engine/rest/JobRestServerIT.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=JobRestServerIT patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch SeaTunnelCommand
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-cli/src/main/java/org/apache/seatunnel/cli/SeaTunnelCommand.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=SeaTunnelCommand patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch ClusterCommand
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-cli/src/main/java/org/apache/seatunnel/cli/ClusterCommand.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=ClusterCommand patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch ClusterClientIT
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-cli/src/test/java/org/apache/seatunnel/cli/ClusterClientIT.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=ClusterClientIT patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Temporary formatting patch ClusterCommandTest
        run: |
          python3 - <<'PYCODE'
          import base64, subprocess
          data = base64.b64encode(subprocess.check_output(['git','diff','--','seatunnel-cli/src/test/java/org/apache/seatunnel/cli/ClusterCommandTest.java'])).decode()
          for i, off in enumerate(range(0,len(data),3500)):
              print(f'::warning title=ClusterCommandTest patch {i}::'+data[off:off+3500])
          PYCODE

      - name: Test engine planning contracts
        run: |
          set +e
          ./mvnw -pl seatunnel-engine -am test > gate.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('gate.log').read_text().splitlines()
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-55:])
          for i,off in enumerate(range(0,len(text),2500)):
              part=text[off:off+2500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Build {i}::'+part)
          PYCODE
          exit "$status"

      - name: Verify engine cluster and task execution
        run: |
          set +e
          ./mvnw -pl seatunnel-engine -am verify > gate.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('gate.log').read_text().splitlines()
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-55:])
          for i,off in enumerate(range(0,len(text),2500)):
              part=text[off:off+2500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Build {i}::'+part)
          PYCODE
          exit "$status"

      - name: Test connectors and local core
        run: |
          set +e
          ./mvnw -pl connector-fake,connector-console,seatunnel-core -am test > gate.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('gate.log').read_text().splitlines()
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-55:])
          for i,off in enumerate(range(0,len(text),2500)):
              part=text[off:off+2500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Build {i}::'+part)
          PYCODE
          exit "$status"

      - name: Verify runnable CLI and E2E
        run: |
          set +e
          ./mvnw -pl seatunnel-cli -am verify > gate.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('gate.log').read_text().splitlines()
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-55:])
          for i,off in enumerate(range(0,len(text),2500)):
              part=text[off:off+2500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Build {i}::'+part)
          PYCODE
          exit "$status"

      - name: Run documented local example
        run: java -jar seatunnel-cli/target/seatunnel-cli-3.0.0-SNAPSHOT.jar --config examples/fake-to-console.conf --mode local

      - name: Build, test, and verify (Spotless + license + JaCoCo)
        run: |
          set +e
          ./mvnw -B -ntp verify > gate.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('gate.log').read_text().splitlines()
          errors = [line for line in lines if '[ERROR]' in line or '<<< FAILURE' in line or '<<< ERROR' in line]
          text = '\n'.join(errors[-55:])
          for i,off in enumerate(range(0,len(text),2500)):
              part=text[off:off+2500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=Build {i}::'+part)
          PYCODE
          exit "$status"

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/surefire-reports/**
            **/failsafe-reports/**
          if-no-files-found: ignore
