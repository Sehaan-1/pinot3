# Existing InnoDB table: events(id BIGINT NOT NULL, name TEXT NOT NULL).
# MYSQL_DATABASE must exactly match the database in MYSQL_URL.
# Requires operator-supplied Connector/J26.10.0 classpath; see docs/MYSQL-DRIVER.md.
source {
  plugin = jdbc-mysql
  options {
    url = ${MYSQL_URL}
    user = ${MYSQL_USER}
    password = ${MYSQL_PASSWORD}
    schema = ${MYSQL_DATABASE}
    table = events
    columns = [
      { name = id, type = LONG, nullable = false },
      { name = name, type = STRING, nullable = false }
    ]
    fetch-size = 500
    query-timeout-seconds = 30
    # Optional all-or-none range restriction (excludes NULL/out-of-range keys):
    # partition-column = id
    # lower-bound = 0
    # upper-bound = 100000
    # partitions = 4
  }
}
sink.plugin = console
