# Bounded UNION ALL in list order; duplicate row-11 is deliberately retained.
sources = [
  { plugin = fake, options = { rows = 2, start = 10, split-size = 1 } },
  { plugin = fake, options = { rows = 0 } },
  { plugin = fake, options = { rows = 2, start = 11, split-size = 1 } }
]
transforms = [
  { plugin = filter-token, options = { field = name, delimiter = "-", tokens = ["11", "12"], mode = any } },
  { plugin = row-kind-extractor, options = { target = change } }
]
sink.plugin = console
