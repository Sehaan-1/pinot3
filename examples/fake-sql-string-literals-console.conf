env.parallelism = 1
source {
  plugin = fake
  options { rows = 2, start = 10 }
}
transforms = [
  { plugin = sql-string, options = { expression = "UPPER(CONCAT('user-', COALESCE(name, 'unknown')))", target = decorated } },
  { plugin = sql-project, options = { columns = "id, decorated" } }
]
sink.plugin = console
