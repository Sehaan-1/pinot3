# mkdir -p /tmp/seatunnel-files first; output must not exist. Local trusted directory only.
source { plugin=fake, options { rows=3, start=10 } }
transforms = [{ plugin=sql-project, options.columns="name" }]
sink {
  plugin = file
  options { root="/tmp/seatunnel-files", path="rows.text", format=text }
}
