# Run write-orc.conf first. Files are never auto-discovered or inferred.
source {
  plugin = file
  options {
    root = "/tmp/seatunnel-files"
    paths = ["rows.orc"]
    format = orc
    schema = [{name=id,type=LONG,nullable=false},{name=name,type=STRING,nullable=false}]
  }
}
sink.plugin = console
