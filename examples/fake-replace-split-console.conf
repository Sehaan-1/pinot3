env.parallelism = 1
source {
  plugin = fake
  options { rows = 2, start = 10 }
}
transforms = [
  { plugin = string-replace, options = { field = name, search = "-", replacement = "|" } },
  { plugin = string-split, options = { field = name, separator = "|", fields = [prefix, number] } }
]
sink.plugin = console
