# Explicit plaintext is for local development only. Both topics must already exist.
source {
  plugin = kafka
  options {
    bootstrap-servers = ["localhost:9092"]
    security-protocol = PLAINTEXT
    topic = input-events
    group-id = seatunnel-copy
    mode = bounded
    partitions = [{ partition = 0, start-offset = 0, end-offset = 10 }]
  }
}
sink {
  plugin = kafka
  options {
    bootstrap-servers = ["localhost:9092"]
    security-protocol = PLAINTEXT
    topic = output-events
  }
}
