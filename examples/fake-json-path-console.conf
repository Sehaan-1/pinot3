env.parallelism = 1
source {
  plugin = fake
  options { rows = 1, start = 10 }
}
transforms = [
  {
    plugin = string-replace
    options {
      field = name
      search = "row-10"
      replacement = "{\"user\":{\"name\":\"Ada\"}}"
    }
  },
  { plugin = json-path, options = { field = name, path = "$.user.name", target = extracted } }
]
sink.plugin = console
