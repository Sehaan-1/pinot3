# Requires existing table public.events(id BIGINT NOT NULL, name TEXT NOT NULL).
# Supply PG_URL without query properties (jdbc:postgresql://host:5432/database), PG_USER,
# PG_PASSWORD via environment. TLS verify-full is default; configure trust via JVM/pgjdbc.
source {
  plugin = jdbc-postgres
  options {
    url = ${PG_URL}
    user = ${PG_USER}
    password = ${PG_PASSWORD}
    schema = public
    table = events
    columns = [
      { name = id, type = LONG, nullable = false },
      { name = name, type = STRING, nullable = false }
    ]
    fetch-size = 500
    query-timeout-seconds = 30
    # Optional all-or-none range restriction; excludes NULL partition keys and rows outside range:
    # partition-column = id
    # lower-bound = 0
    # upper-bound = 100000
    # partitions = 4
  }
}
sink.plugin = console
