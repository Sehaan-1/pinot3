# Requires existing writable table public.events(id BIGINT NOT NULL, name TEXT NOT NULL).
# Re-running inserts duplicates or fails existing uniqueness constraints: no upsert/exactly-once.
source { plugin = fake, options { rows = 3, start = 10 } }
sink {
  plugin = jdbc-postgres
  options {
    url = ${PG_URL}
    user = ${PG_USER}
    password = ${PG_PASSWORD}
    schema = public
    table = events
    batch-size = 100
    query-timeout-seconds = 30
  }
}
