# Existing InnoDB table: events(id BIGINT NOT NULL, name TEXT NOT NULL).
# Append-only; reruns may duplicate rows or fail uniqueness constraints.
# External official Connector/J driver required; see docs/MYSQL-DRIVER.md.
source { plugin = fake, options { rows = 3, start = 10 } }
sink {
  plugin = jdbc-mysql
  options {
    url = ${MYSQL_URL}
    user = ${MYSQL_USER}
    password = ${MYSQL_PASSWORD}
    schema = ${MYSQL_DATABASE}
    table = events
    batch-size = 100
    query-timeout-seconds = 30
  }
}
